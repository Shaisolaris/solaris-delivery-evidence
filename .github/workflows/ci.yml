name: Focused delivery evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise the actual bundled engines and negative controls
        run: python -I -B -m unittest discover -s tests -v
      - name: Run the disposable clean-to-stale demonstration
        run: python -I -B skills/delivery-evidence/examples/demo.py
